*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-vn);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.jp{font-family:var(--f-jp)}
button{font:inherit;color:inherit}
kbd{font-family:var(--f-vn);font-size:.72em;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.6;font-weight:400;line-height:1.4}
@media (hover:none){kbd{display:none}}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(10px);backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.seal{width:38px;height:38px;border-radius:9px;background:var(--ver);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;transform:rotate(-7deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 2px 6px rgba(194,58,34,.3);flex:none;font-family:var(--f-vn)}
.brand b{display:block;font-size:17px;letter-spacing:.06em;line-height:1.15;white-space:nowrap}
.brand small{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:13px;line-height:1.25;white-space:nowrap}
.ver{font-style:normal;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:0 6px;border-radius:5px;letter-spacing:.04em}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{border:0;background:transparent;color:var(--ink-2);font-size:15px;padding:8px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .ic{width:18px;height:18px}
.tab:hover{background:var(--surface-3)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sync{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.sync .ic{width:17px;height:17px}
.sync[data-s="synced"]{color:var(--good)}.sync[data-s="saving"],.sync[data-s="connecting"]{color:var(--pri-ink)}.sync[data-s="offline"],.sync[data-s="error"]{color:var(--again)}
.bnav{display:none}
@media (max-width:860px){.tab span{display:none}.tab{padding:9px}}
@media (max-width:720px){
  .tabs{display:none}.sync{margin-left:auto}.sync span{display:none}.sync{padding:8px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:5px max(6px,env(safe-area-inset-left)) calc(5px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-right))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--muted);cursor:pointer;border-radius:12px}
  .bnav button .ic{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--pri-ink);background:var(--pri-soft)}
  main{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
}
main{padding-top:6px;padding-bottom:48px}
.h-page{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.h-page h1{font-size:26px;line-height:1.2;margin:0}
.h-page p{margin:4px 0 0;color:var(--muted)}

/* buttons */
.btn{border:1.5px solid transparent;font-size:15.5px;font-weight:700;border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-align:center}
.btn .ic{width:18px;height:18px}
.btn-pri{background:var(--pri);color:var(--on-pri)}.btn-pri:hover{background:var(--pri-hover)}
.btn-sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}.btn-sec:hover{background:var(--surface-3)}
.btn-ghost{background:transparent;color:var(--ink-2)}.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:var(--again-bg);color:var(--again);border-color:color-mix(in srgb,var(--again) 35%,transparent)}
.btn-sm{font-size:14px;padding:7px 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.icon-btn:focus-visible,.rate:focus-visible,.cday:focus-visible,.wrow:focus-visible,.wchip:focus-visible,.sync:focus-visible,.bnav button:focus-visible{outline:none;box-shadow:var(--ring)}
.btn[data-armed],.icon-btn[data-armed]{background:var(--again);color:#fff}
.icon-btn{border:0;background:transparent;color:var(--ink-2);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-3)}.icon-btn:disabled{opacity:.35;cursor:default;background:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow-1)}
.panel h2{font-size:16.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h2 .ic{color:var(--muted)}
.panel h2 .aside{margin-left:auto;font-size:13.5px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}.small{font-size:14px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.stack{display:grid;gap:16px;align-content:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hc);color:#fff;padding:26px 28px 24px;margin-top:18px;box-shadow:var(--shadow-2);isolation:isolate}
.hero .sg{position:absolute;top:0;right:0;width:62%;height:100%;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.sg circle{fill:var(--hc);stroke:rgba(255,255,255,.2);stroke-width:1.1}
.hero .kick{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.88}
.hero h1{font-size:34px;line-height:1.15;margin:8px 0 4px}
.hero .theme{font-size:18.5px;opacity:.95;max-width:34em}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 18px}
.hero .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 13px 5px 11px;font-size:14px;display:flex;align-items:baseline;gap:7px}
.hero .pill b{font-size:19px;line-height:1.2}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-hero{background:#fff;color:var(--hc);font-size:17px;padding:13px 22px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.btn-hero:hover{background:#f4f1ea}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.btn-glass:hover{background:rgba(255,255,255,.22)}
.hero .doneline{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px}
@media (max-width:560px){.hero{padding:22px 18px 20px;border-radius:22px}.hero h1{font-size:27px}.hero .theme{font-size:16.5px}.btn-hero{width:100%}.hero .acts .btn-glass{flex:1}}

/* catch-up */
.catch{margin-top:16px;border:1.5px dashed color-mix(in srgb,var(--hard) 45%,var(--line));background:color-mix(in srgb,var(--hard-bg) 60%,var(--surface));border-radius:18px;padding:14px 16px}
.catch-foot{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.catch h3{margin:0 0 8px;font-size:15.5px;display:flex;gap:8px;align-items:center;color:var(--hard)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;cursor:pointer}
.gchip:hover{border-color:var(--wc)}
.gchip i{width:10px;height:10px;border-radius:50%;background:var(--wc)}
.gchip em{font-style:normal;color:var(--muted)}

/* progress figure */
.segbar{display:flex;gap:2px;height:28px}
.segbar span{min-width:0;border-radius:4px;display:flex;align-items:center;padding-left:7px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:visible;cursor:default}
.sb-mature{background:var(--v1);color:var(--v1-ink)}.sb-review{background:var(--v2);color:var(--v2-ink)}.sb-learn{background:var(--v3);color:var(--v3-ink)}.sb-new{background:var(--vt);color:var(--vt-ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:var(--surface-2)}
.tile .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.tile .k i{width:10px;height:10px;border-radius:3px;flex:none}
.tile .v{font-size:23px;font-weight:700;line-height:1.25}
.tile .s{font-size:12.5px;color:var(--muted)}
.sw-mature{background:var(--v1)}.sw-review{background:var(--v2)}.sw-learn{background:var(--v3)}.sw-new{background:var(--vt);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--v2) 40%,transparent)}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr)}}

/* stat line */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:10px 12px}
.stat .v{font-size:24px;font-weight:700;line-height:1.2;display:flex;align-items:center;gap:6px}
.stat .v .ic{color:var(--gold);width:20px;height:20px}
.stat .k{font-size:13px;color:var(--muted)}

/* week strip */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wsd{border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center;background:var(--surface);cursor:pointer;display:grid;gap:3px;justify-items:center;font-size:12.5px;color:var(--ink-2)}
.wsd b{font-size:15px;color:var(--ink)}
.wsd .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.wsd .dot .ic{width:14px;height:14px}
.wsd.ok .dot{background:var(--good);color:#fff}
.wsd.miss .dot{background:var(--again-bg);box-shadow:inset 0 0 0 1.5px var(--again)}
.wsd.today{border-color:var(--wc);box-shadow:inset 0 0 0 1.5px var(--wc)}
.wsd.today .dot{box-shadow:inset 0 0 0 2px var(--wc)}
.wsd.fut .dot{box-shadow:inset 0 0 0 1.5px var(--line-2)}
.wsd.k-review,.wsd.k-verbs,.wsd.k-test{background:var(--surface-2)}

/* forecast chart */
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;border-bottom:1px solid var(--v-base);padding-top:6px}
.fc-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;cursor:default;border-radius:8px;outline:none}
.fc-col:hover,.fc-col:focus-visible{background:var(--surface-2)}
.fc-col .val{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fc-col .bar{width:min(24px,70%);background:var(--v-bar);border-radius:4px 4px 0 0;min-height:0}
.fc-col.zero .bar{display:none}
.fc-x{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;font-size:12px;color:var(--muted);text-align:center}
.fc-x b{color:var(--ink);font-weight:700}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13.5px;padding:7px 10px;border-radius:9px;max-width:260px;opacity:0;transition:opacity .12s;box-shadow:var(--shadow-2)}
.tip.show{opacity:1}

/* calendar */
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-h{margin-bottom:6px}
.cal-h div{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.cal{margin-bottom:8px}
.cday{position:relative;min-height:118px;border-radius:14px;border:1px solid var(--line);border-top:5px solid var(--wc);background:var(--surface);padding:8px 9px 9px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cday:hover{border-color:var(--line-2);border-top-color:var(--wc)}
.cday .top1{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.cday .dnum{font-weight:700;font-size:21px;color:var(--wt);line-height:1}
.cday .ddate{font-size:12px;color:var(--muted)}
.cday .dtype{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--wt);margin-top:4px}
.cday .dsh{display:none;font-size:11px;font-weight:700;color:var(--wt);margin-top:3px}
.cday .dname{font-size:13px;color:var(--ink-2);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cday .dfoot{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:8px}
.cday .dbar{flex:1;min-width:0;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.cday .dbar i{display:block;height:100%;background:var(--wc)}
.cday .dck{flex:none;margin-left:auto;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.cday .dck .ic{width:12px;height:12px}
.cday.k-review{background:color-mix(in srgb,var(--wc) 8%,var(--surface))}
.cday.k-verbs,.cday.k-test{background:var(--gold-soft);border-top-color:var(--gold-bg)}
.cday.k-verbs .dnum,.cday.k-test .dnum,.cday.k-verbs .dtype,.cday.k-test .dtype{color:var(--gold)}
.cday.today{box-shadow:0 0 0 2.5px var(--wc)}
.cday.k-verbs.today,.cday.k-test.today{box-shadow:0 0 0 2.5px var(--gold-bg)}
.cday.sel{outline:2px solid var(--ink);outline-offset:2px}
.cday .tdy{margin-left:auto;font-size:10.5px;white-space:nowrap;font-weight:700;background:var(--wc);color:#fff;border-radius:6px;padding:0 6px}
.cday.k-verbs .tdy,.cday.k-test .tdy{background:var(--gold-bg);color:#1d1b17}
.cempty{border-radius:14px;background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px);min-height:40px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:4px 0 14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--wc)}
@media (max-width:720px){
  .cal,.cal-h{gap:4px}
  .cday{min-height:66px;padding:6px 5px 7px;border-radius:10px;border-top-width:4px}
  .cday .ddate,.cday .dname,.cday .tdy,.cday .dtype{display:none}
  .cday .dsh{display:block}
  .cday.k-verbs .dsh,.cday.k-test .dsh{color:var(--gold)}
  .cday .dnum{font-size:17px}
  .cday .dtype{font-size:9.5px;letter-spacing:0}
  .cday .dck{width:14px;height:14px}
  .cday .dck .ic{width:9px;height:9px}
}
.detail{margin-top:8px;scroll-margin-top:80px}
.detail .dh{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.detail .dh .badge{width:58px;height:58px;border-radius:16px;background:var(--wc);color:#fff;display:grid;place-items:center;text-align:center;line-height:1;flex:none}
.detail .dh .badge b{font-size:22px;display:block}.detail .dh .badge small{font-size:10.5px;letter-spacing:.06em}
.detail.k-verbs .badge,.detail.k-test .badge{background:var(--gold-bg);color:#1d1b17}
.detail h3{margin:2px 0 2px;font-size:20px;line-height:1.25}
.detail .meta{color:var(--muted);font-size:14px}
.detail .acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.mini{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-top:8px}
.mini b{color:var(--ink)}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);border-left:4px solid var(--sc,var(--vt));background:var(--surface-2);border-radius:9px;padding:3px 9px;font-size:17px;cursor:pointer;line-height:1.5}
.wchip:hover{background:var(--surface-3)}
.s-new{--sc:var(--vt)}.s-learn{--sc:var(--v3)}.s-review{--sc:var(--v2)}.s-mature{--sc:var(--v1)}
.glist{display:grid;gap:8px}
.gitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.gitem .gn{width:34px;height:34px;border-radius:10px;background:var(--wc);color:#fff;display:grid;place-items:center;font-weight:700}
.gitem .gt{font-size:15px;line-height:1.3}.gitem .gt small{display:block;color:var(--muted);font-size:13px}
.pbar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:5px;display:flex;gap:2px}
.pbar i{display:block;height:100%}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* word list */
.filters{display:grid;grid-template-columns:1fr 210px 180px;gap:10px;margin-bottom:12px}
@media (max-width:720px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
.input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:var(--ring)}
.input.jp{font-size:18px}
.qwrap{position:relative}.qwrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}.qwrap .input{padding-left:38px}
.wl{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:50px minmax(0,1.1fr) minmax(0,1fr) minmax(0,2fr) 128px;gap:10px;align-items:center;padding:9px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.wrow:hover{border-color:var(--line-2);background:var(--surface-2)}
.wrow .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.wrow .w{font-size:21px;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.wrow .k{font-size:15.5px;color:var(--ink-2);overflow-wrap:anywhere}
.wrow .m{font-size:15px;line-height:1.35}
.wrow .st{justify-self:end;text-align:right;font-size:13px;color:var(--ink-2);display:grid;justify-items:end}
.wrow .st small{color:var(--muted);font-size:12px}
.sdot{display:inline-flex;align-items:center;gap:6px}
.sdot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc)}
.sdot.s-new::before{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--v2) 55%,transparent)}
@media (max-width:720px){
  .wrow{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"n w st" "n k st" "n m m";gap:2px 10px;padding:9px 12px}
  .wrow .n{grid-area:n;align-self:start;padding-top:5px}.wrow .w{grid-area:w}.wrow .k{grid-area:k}.wrow .m{grid-area:m;margin-top:3px}.wrow .st{grid-area:st;align-self:start}
}
.more{display:flex;justify-content:center;margin-top:12px}
.empty{padding:30px 16px;text-align:center;color:var(--muted)}

/* forms */
.form .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:grid;gap:5px;align-content:start}
.field.span2{grid-column:1/-1}
.field label,.flab{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.req{color:var(--again)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.hint.err{color:var(--again)}.hint.warn{color:var(--hard)}
.pair-in{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.pair-in+.pair-in{margin-top:8px}
.factions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media (max-width:560px){.form .fgrid{grid-template-columns:1fr}.pair-in{grid-template-columns:1fr}}
.addgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:4px;align-items:start}
@media (max-width:900px){.addgrid{grid-template-columns:1fr}}
.pv-wrap{display:grid;gap:10px}
.pv-lab{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pv-wrap .face,.pv-wrap .face.back{min-height:0;position:relative;transform:none}
.pv-wrap .f-body{min-height:150px;padding:20px}
details.bulk{margin-top:16px}
details.bulk summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;display:flex;align-items:center;gap:8px}
details.bulk summary::-webkit-details-marker{display:none}
details.bulk summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.bulk[open] summary::after{transform:rotate(180deg)}
.code{font-family:var(--f-jp);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-x:auto;white-space:pre;line-height:1.6}
.bres{margin-top:12px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.bres table{width:100%;border-collapse:collapse;font-size:14px}
.bres td,.bres th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.bres th{position:sticky;top:0;background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bres .bad td{background:var(--again-bg)}.bres .dup td{color:var(--muted)}
.mylist{display:grid;gap:6px}
.myrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;background:var(--surface-2)}
.myrow .t{min-width:0}.myrow .t b{font-size:19px}.myrow .t span{color:var(--ink-2);margin-left:8px}.myrow .t small{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.set{display:grid;gap:16px;margin-top:4px}
.setrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t b{display:block;font-size:15.5px}.setrow .t small{color:var(--muted);font-size:13.5px}
.setrow .input,.setrow select{width:auto}
.switch{position:relative;width:48px;height:28px;flex:none}

function goalPanel() {

function parseTSV(text) {

    else if (ch === '"' && f === '') q = true;

    else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; }

  if (/dong tu|^v$|verb/.test(n)) return 'V';

  if (/tinh tu na|adj ?-?na|な/.test(n) || /^na$/.test(n)) return 'ANA';

function applyImport(replace) {
  const o = IMPORTED; if (!o) return;
  const inS = migrate(o.state), inW = o.words || {};
  if (replace) {
    const t = now();
    for (const id in CW) if (!inW[id]) CW[id] = {id, del:true, at:CW[id].at || 0, upd:t};
    for (const id in inW) CW[id] = Object.assign({}, inW[id], {upd:t});
    const oldNotes = S.notes || {};
    S = inS; S.settings.upd = t; S.resetAt = t; S.upd = t;
    for (const id in S.notes) S.notes[id].u = t;
    for (const id in oldNotes) if (!S.notes[id]) S.notes[id] = {t:'', u:t};
    for (const id in S.cards) S.cards[id][7] = Math.max(S.cards[id][7], Math.ceil(t / MIN));
  } else {
    const cut = Math.floor((S.resetAt || 0) / MIN), bump = Math.ceil(now() / MIN);
    for (const id in inS.cards) {
      const rc = inS.cards[id]; if (!Array.isArray(rc) || rc.length < 9) continue;
      const lc = S.cards[id];
      if (!lc || rc[7] > lc[7]) { const c = rc.slice(); if (c[7] < cut) c[7] = bump; S.cards[id] = c; }
    }
    mergeMeta({settings:{}, log:inS.log, tests:inS.tests, notes:inS.notes || {}});
    mergeWords(Object.values(inW));
  }
  applyCustom(); touch('srs', 'meta'); Object.keys(CW).forEach(id => Sync.putWord(id));
  IMPORTED = null; toast(replace ? 'Đã khôi phục dữ liệu' : 'Đã gộp dữ liệu sao lưu'); render();
}

function interleave(rev, neu) {
  if (!rev.length) return neu.slice(); if (!neu.length) return rev.slice();
  const out = [], k = Math.max(1, Math.round(rev.length / neu.length)); let i = 0, j = 0;
  while (i < rev.length || j < neu.length) { for (let x = 0; x < k && i < rev.length; x++) out.push(rev[i++]); if (j < neu.length) out.push(neu[j++]); }
  return out;
}
const ordList = ids => S.settings.shuffle ? shuffle(ids.slice()) : ids;

  const title = b && b.ids.length ? `Hôm nay · ${batchTitle(b)} · ${batchShort(b)}` : 'Học hôm nay';
  openSession({mode:'srs', title, main:interleave(shuffle([...q.rev, ...q.kNew]), ordList(q.neu)), learn:q.learn});
}

function startPractice(k, el) {
  let ids = [], title = 'Luyện tập', ordered = false;
  if (k === 'group') { const g = el.dataset.g === 'u' ? 'u' : +el.dataset.g; ids = (g === 'u' ? CUSTOM_IDS : GROUP_IDS[g]).slice(); title = `Luyện tập · ${groupName(g)}`; }

  else if (k === 'week') { const w = +el.dataset.w; ids = weekIds(w); title = `Ôn tập tuần ${w}`; }
  else if (k === 'weak') { const w = +el.dataset.w; ids = weakIds(weekIds(w)); title = `Ôn từ khó · tuần ${w}`; }
  else if (k === 'verbs') { ids = shuffle(PAIRS.slice()).flat(); ordered = true; title = 'Luyện cặp động từ tự / tha'; }
  else if (k === 'redo') { ids = (SES && SES.wrong || []).slice(); title = 'Luyện lại từ đã quên'; }
  else if (k === 'leech') { ids = leechCards(); title = 'Ôn từ hay quên'; }
  openSession({mode:'practice', title, main:ordered ? ids : ordList(ids), learn:[]});
}

function openSession(o) {
  if (!o.main.length && !o.learn.length) { toast('Không có thẻ nào để học ở mục này.'); return; }
  closeModal(); hideTip();
  SES = Object.assign(o, {cur:null, flipped:false, revealed:false, done:0, stats:{1:0, 2:0, 3:0, 4:0}, hist:[], wrong:[], lapsed:new Set(), started:now(), shownAt:0, lastId:null, finished:false, saved:false});
  const st = $('#study'); st.hidden = false; document.body.style.overflow = 'hidden';
  advance();
}
function pickNext() {
  const nm = now() / MIN;
  if (SES.mode !== 'srs') return SES.main[0] || null;
  const lq = SES.learn.map(id => [id, S.cards[id] ? S.cards[id][1] : 0]).sort((a, b) => a[1] - b[1]);
  if (lq.length && lq[0][1] <= nm) return lq[0][0];
  if (SES.main.length) return SES.main[0];
  const ahead = lq.filter(x => x[1] <= nm + LEARN_AHEAD);
  if (ahead.length) { const alt = ahead.find(x => x[0] !== SES.lastId); return (alt || ahead[0])[0]; }
  return null;
}
let waitT = 0;
function advance(forceId) {
  clearInterval(waitT);
  const id = forceId || pickNext();
  SES.cur = id; SES.flipped = false; SES.revealed = false; SES.typed = null; SES.shownAt = now();
  if (!id) {
    SES.finished = !(SES.mode === 'srs' && SES.learn.length);
    if (SES.finished && SES.mode === 'test' && !SES.saved) { SES.saved = true; S.tests.push({d:studyDate(), n:SES.done, ok:SES.done - SES.wrong.length, at:now()}); touch('meta'); }
    renderStudy();
    if (!SES.finished) waitT = setInterval(() => { const n = pickNext(); if (n) advance(); else { const w = $('#waitLeft'); if (w) w.textContent = waitLeft(); } }, 1000);
    return;
  }
  renderStudy();
  const kc = isKCard(id), w = WORDS.get(wordOf(id));
  if (!kc && w && (S.settings.autoSpeak || (S.settings.listen && SES.mode !== 'test'))) speak(w.k);
  if (kc && S.settings.typeK && FINE_PTR) setTimeout(() => { const i = $('#kAns'); if (i && SES && SES.cur === id && !SES.typed && !SES.flipped) i.focus({preventScroll:true}); }, 30);
}
function waitLeft() { const t = Math.min(...SES.learn.map(id => S.cards[id] ? S.cards[id][1] : 0)); const s = Math.max(0, Math.round((t - LEARN_AHEAD) * 60 - now() / 1000)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }

  const b = $('#acctBtn'); if (!b) return;
  const m = Sync.mode, sess = ACC.sess, inAcct = (m === 'server' && !!sess) || m === 'claude';
  const sy = $('#sync'); if (sy) sy.classList.toggle('compact', !inAcct);
  if (needLogin() || (Sync.state === 'connecting' && !inAcct)) { b.hidden = true; return; }
  b.hidden = false;
  if (inAcct) {
    const nm = sess ? sess.user.display : ACCOUNT.name, sub = sess ? '@' + sess.user.name : ACCOUNT.email;
    const gn = givenName(nm) || (ACCOUNT.email || '').split('@')[0] || 'Tài khoản';
    b.className = 'acctbtn in';
    b.innerHTML = `<span class="av" aria-hidden="true">${esc(initialOf(nm || gn))}</span><span class="an">${esc(gn)}</span>`;
    b.title = `Đã đăng nhập: ${nm || gn}${sub ? ' (' + sub + ')' : ''} — tiến độ tự lưu vào tài khoản`;
  } else {
    b.className = 'acctbtn';
    b.innerHTML = `${ic('login')}<span class="l-long">${IN_CLAUDE ? 'Bật lưu tài khoản' : 'Đăng nhập'}</span><span class="l-short">${IN_CLAUDE ? 'Bật lưu' : 'Đăng nhập'}</span>`;
    b.title = IN_CLAUDE ? 'Cho phép ứng dụng lưu tiến độ vào tài khoản' : 'Đăng nhập tài khoản học viên để lưu tiến độ lên máy chủ của nhóm';
  }
  b.setAttribute('aria-label', b.title);
}
function acctAction() {
  if ((Sync.mode === 'server' && ACC.sess) || Sync.mode === 'claude') { if (SES) exitStudy(); go('settings'); const a = $('#acctBox'); if (a) a.scrollIntoView({block:'center'}); return; }
  if (IN_CLAUDE) { enableCloud(); return; }
  openLoginModal('login');
}
async function enableCloud() {
  const p = await cap('permissions');
  if (p) {
    try { const r = await p.request(['db', 'user']); if (r && r.db !== 'denied' && r.user !== 'denied') { await Sync.init(); if (Sync.mode === 'claude') { toast('Đã bật lưu vào tài khoản'); return; } } } catch (e) {}
    try { await p.manage(); await Sync.init(); if (Sync.mode === 'claude') return; } catch (e) {}
  }
  toast('Chưa bật được — hãy mở menu Quyền (Permissions) của trang và cho phép lưu dữ liệu.');
}

UI.auth = {kind:'login', msg:'', busy:false, url:null};
async function loadAuthInfo(url) {
  const u = GAS ? '' : normUrl(url);
  if (!GAS && !u) { ACC.info = null; ACC.infoUrl = ''; refreshAuth(); return; }
  if (ACC.infoBusy) return;
  ACC.infoBusy = true; ACC.infoErr = ''; refreshAuth();
  try { const r = await srvCall({a:'info'}, u); if (!r || !r.ok) throw r; ACC.info = r; ACC.infoUrl = u; }
  catch (e) { ACC.info = null; ACC.infoErr = srvMsg(e); }
  finally { ACC.infoBusy = false; refreshAuth(); }
}
function authKind() {
  const i = ACC.info, k = UI.auth.kind;
  if (i && !i.hasAdmin) return 'setup';
  if (k === 'register' && !(i && i.selfReg)) return 'login';
  return k === 'setup' ? 'login' : k;
}

      + f('authDisplay', 'Họ và tên', 'text', 'name', 'maxlength="40"') + nameF

      + (kind === 'register' ? f('authCode', 'Mã lớp', 'text', 'off', 'autocapitalize="characters" spellcheck="false"', 'quản trị viên gửi cho bạn') : '');
  const urlF = off && FIXED_SRV ? `<input type="hidden" id="authUrl" value="${esc(FIXED_SRV)}">` : off ? `<label class="fl" for="authUrl"><span>Link máy chủ của nhóm <small>quản trị viên gửi cho bạn, đuôi /exec</small></span><input class="input" id="authUrl" type="url" autocomplete="url" spellcheck="false" placeholder="https:\/\/script.google.com/macros/s/…/exec" value="${esc(url)}"></label>` : '';

  const go = kind === 'setup' ? 'Tạo tài khoản quản trị' : kind === 'register' ? 'Đăng ký và vào học' : 'Đăng nhập';

const viewAuth = () => `<div class="auth">${authHtml(false)}</div>`;
function refreshAuth() {
  const box = $('#authBox');
  if (!box) { if (needLogin() && !SES) render(); return; }
  const keep = {}; box.querySelectorAll('input').forEach(i => { keep[i.id] = i.type === 'checkbox' ? i.checked : i.value; });
  const act = document.activeElement && document.activeElement.id;
  box.outerHTML = authHtml(box.classList.contains('in-modal'));
  $('#authBox').querySelectorAll('input').forEach(i => { if (i.id in keep) { if (i.type === 'checkbox') i.checked = keep[i.id]; else i.value = keep[i.id]; } });
  if (act) { const a = document.getElementById(act); if (a) a.focus(); }
}
function openLoginModal(kind) {
  UI.auth = {kind:kind || 'login', msg:'', busy:false, url:null};
  openModal(authHtml(true));
  const u = srvUrl();
  if (u && (!ACC.info || ACC.infoUrl !== u)) loadAuthInfo(u);
  const first = $(u ? '#authName' : '#authUrl'); if (first) first.focus();
}
async function doAuth(form) {
  if (UI.auth.busy) return;
  const kind = form.dataset.kind, val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const err = m => { UI.auth.msg = m; const e = $('#authErr'); if (e) e.textContent = m; };
  const url = GAS ? '' : normUrl(val('authUrl'));
  if (!GAS && !url) return err('Hãy nhập link máy chủ của nhóm (bắt đầu bằng https:\/\/ và kết thúc bằng /exec).');
  const name = val('authName').trim().toLowerCase(), pw = val('authPw');
  if (!USER_RE.test(name)) return err(kind === 'login' && !name ? 'Hãy nhập tên đăng nhập.' : SRV_ERR.bad_name);
  if (!pw) return err('Hãy nhập mật khẩu.');
  let req;
  if (kind === 'login') req = {a:'login', name};
  else {
    const display = val('authDisplay').trim(), code = val('authCode').trim();
    if (!display) return err('Hãy nhập họ và tên.');
    if (pw.length < 6) return err('Mật khẩu cần ít nhất 6 ký tự.');
    if (pw !== val('authPw2')) return err('Hai lần nhập mật khẩu chưa khớp.');
    if (!code) return err(kind === 'setup' ? 'Hãy nhập Mã khởi tạo (tab CaiDat trong Google Sheet máy chủ).' : 'Hãy nhập mã lớp.');
    req = {a:kind, name, display, code};
  }
  const carry = !!($('#authCarry') && $('#authCarry').checked);
  UI.auth.busy = true; UI.auth.msg = ''; UI.auth.url = GAS ? null : val('authUrl'); refreshAuth();
  try {
    req.dk = await pwKey(name, pw);
    const r = await srvCall(req, url);
    if (!r || !r.ok) throw r;
    if (!GAS) lsSet(SRV_KEY, url);
    UI.auth = {kind:'login', msg:'', busy:false, url:null};
    startSession({token:r.token, user:r.user, url}, r.data || null, carry);
  } catch (e) {
    UI.auth.busy = false; UI.auth.msg = srvMsg(e); refreshAuth();
    const p = $('#authPw'); if (p && e && e.err === 'bad_login') { p.value = ''; p.focus(); }
  }
}
function closeStudyQuiet() { if (!SES) return; clearInterval(waitT); SES = null; const st = $('#study'); st.hidden = true; st.innerHTML = ''; document.body.style.overflow = ''; }
function startSession(sess, data, carry) {
  const carried = carry && Sync.mode === 'local' && hasLocalData() ? JSON.parse(JSON.stringify({S, CW})) : null;
  saveLocal(); closeStudyQuiet();
  ACC.sess = sess; saveSess();
  ACCOUNT = {kind:'server', name:sess.user.display, email:sess.user.name};
  loadState(userKey(sess));
  const hadCache = hasLocalData();
  Sync.mode = 'server'; SSync.reset();
  if (data) mergeIncoming(data);
  if (carried) mergeIncoming(carried);
  saveLocal();
  SSync.ready = true; SSync.lastSync = now();
  ADM.users = null; ADM.made = null;
  closeModal(); if (UI.view === 'admin' && !isAdmin()) UI.view = 'today';
  Sync.set('synced'); render();
  if (carried || hadCache) SSync.queue(400);
  toast(`Xin chào, ${givenName(sess.user.display) || sess.user.name}!`);
}
function signedOut() {
  ACC.sess = null; saveSess(); SSync.reset(); closeStudyQuiet(); closeModal();
  ACCOUNT = {kind:'local', name:'', email:''}; ADM.users = null; ADM.made = null;
  if (GAS) { Sync.mode = 'server'; loadState(''); } else { Sync.mode = 'local'; loadState(LS_KEY); }
  UI.view = 'today'; Sync.set('local'); render();
}
function sessionEnded(reason) {
  saveLocal();   // keep this account's unsynced progress on the device: it is merged again after signing back in
  UI.auth = {kind:'login', msg:reason === 'locked' ? SRV_ERR.locked : 'Phiên đăng nhập đã hết hạn hoặc mật khẩu vừa được đổi — hãy đăng nhập lại. Tiến độ chưa đồng bộ vẫn được giữ trên máy này.', busy:false, url:null};
  const msg = UI.auth.msg;
  signedOut();
  if (!GAS) { openLoginModal('login'); UI.auth.msg = msg; refreshAuth(); }
}
async function doLogout(el) {
  if (!ACC.sess) return;
  if (!el.dataset.force) {
    el.disabled = true; el.innerHTML = ic('cloudup') + ' Đang lưu…';
    saveLocal(); const ok = await SSync.flushNow();
    el.disabled = false;
    if (!ok) { el.dataset.force = '1'; el.classList.add('btn-danger'); el.innerHTML = ic('warn') + ' Chưa lưu lên máy chủ được — bấm lần nữa để vẫn đăng xuất'; return; }
  }
  lsDel(STORE);   // shared device: remove this account's progress from the device (it is safe on the server)
  signedOut(); toast('Đã đăng xuất');
}
function pwBoxHtml() {

async function doPasswd(form) {
  const e = m => { const x = $('#pwErr'); if (x) x.textContent = m; };
  const old = $('#pwOld').value, nw = $('#pwNew').value;
  if (!old) return e('Hãy nhập mật khẩu hiện tại.');
  if (nw.length < 6) return e('Mật khẩu mới cần ít nhất 6 ký tự.');
  if (nw !== $('#pwNew2').value) return e('Hai lần nhập mật khẩu mới chưa khớp.');
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; e('');
  try {
    const name = ACC.sess.user.name;
    const r = await srvCall({a:'passwd', token:ACC.sess.token, oldDk:await pwKey(name, old), dk:await pwKey(name, nw)});
    if (!r || !r.ok) { if (r && (r.err === 'auth' || r.err === 'locked')) { sessionEnded(r.err); return; } throw r; }
    ACC.sess.token = r.token; saveSess(); form.reset(); $('#pwBox').hidden = true; toast('Đã đổi mật khẩu');
  } catch (x) { e(srvMsg(x)); } finally { btn.disabled = false; }
}

/* ---- admin page ---- */
const ADM = {users:null, cfg:null, url:'', busy:false, err:'', at:0, made:null};
async function loadAdmin(force) {
  if (!isAdmin() || ADM.busy || (!force && ADM.users && now() - ADM.at < 30000)) return;
  ADM.busy = true; ADM.err = '';
  try {
    const r = await srvCall({a:'adminList', token:ACC.sess.token});
    if (!r || !r.ok) { if (r && (r.err === 'auth' || r.err === 'locked')) { ADM.busy = false; sessionEnded(r.err); return; } throw r; }
    ADM.users = r.users; ADM.cfg = r.cfg; ADM.url = r.url || ''; ADM.at = now();
  } catch (e) { ADM.err = srvMsg(e); }
  ADM.busy = false;
  if (UI.view === 'admin' && !SES && $('#modal').hidden) render();
}
async function admRun(req, okMsg) {
  try {
    const r = await srvCall(Object.assign({token:ACC.sess.token}, req));
    if (!r || !r.ok) { if (r && (r.err === 'auth' || r.err === 'locked')) { sessionEnded(r.err); return null; } throw r; }
    if (okMsg) toast(okMsg); return r;
  } catch (e) { toast(srvMsg(e)); return null; }
}

    <label class="fl" for="admPw"><span>Mật khẩu tạm</span><span class="pwrow"><input class="input" id="admPw" value="${randPw()}" autocomplete="off" spellcheck="false"><button type="button" class="btn btn-ghost btn-sm" data-act="admgen" title="Tạo mật khẩu khác" aria-label="Tạo mật khẩu khác">${ic('reset')}</button></span></label>
    <label class="chk"><input type="checkbox" id="admRole"><span>Cấp quyền quản trị viên</span></label>
    <p class="auth-err" id="admErr" role="alert"></p><div class="row"><button class="btn btn-pri" type="submit">${ic('check')} Tạo tài khoản</button></div></form>${made}</section>`;
  const invite = `<section class="panel"><h2>${ic('link')} Mời học viên tự đăng ký</h2>
    ${ADM.url ? `<div class="urlbox"><code id="appUrl">${esc(ADM.url)}</code><button class="btn btn-ghost btn-sm" data-act="admcopyurl">${ic('copy')} Chép link</button></div>` : ''}
    <div class="setrow"><div class="t"><b>Mã lớp: <span class="code">${esc(cfg.cls || '—')}</span></b><small>Học viên mở link, chọn Đăng ký và nhập mã này.</small></div><button class="btn btn-sec btn-sm" data-act="admcode" data-confirm="Bấm lần nữa: mã cũ hết dùng được">${ic('reset')} Đổi mã</button></div>
    <div class="setrow"><div class="t"><b>Cho phép tự đăng ký</b><small>Tắt khi lớp đã đủ người — khi đó chỉ quản trị viên tạo được tài khoản.</small></div><label class="switch"><input type="checkbox" id="admSelf" ${cfg.selfReg ? 'checked' : ''} aria-label="Cho phép tự đăng ký"><i></i></label></div></section>`;
  return head + `<div class="grid2" style="margin-top:0"><div class="stack">${list}</div><div class="stack">${add}${invite}</div></div>`;
}
async function doAdmCreate(form) {
  const e = m => { const x = $('#admErr'); if (x) x.textContent = m; };
  const display = $('#admDisplay').value.trim(), name = $('#admName').value.trim().toLowerCase(), pw = $('#admPw').value.trim(), role = $('#admRole').checked ? 'admin' : 'user';
  if (!display) return e('Hãy nhập họ và tên.');
  if (!USER_RE.test(name)) return e(SRV_ERR.bad_name);
  if (pw.length < 6) return e('Mật khẩu tạm cần ít nhất 6 ký tự.');
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; e('');
  try {
    const r = await srvCall({a:'adminCreate', token:ACC.sess.token, name, display, role, dk:await pwKey(name, pw)});
    if (!r || !r.ok) { if (r && (r.err === 'auth' || r.err === 'locked')) { sessionEnded(r.err); return; } throw r; }
    ADM.made = {name, pw, display}; (ADM.users = ADM.users || []).push(r.user);
    toast('Đã tạo tài khoản ' + name); render();
    const mb = $('.madebox'); if (mb) mb.scrollIntoView({block:'center'});
  } catch (x) { e(srvMsg(x)); btn.disabled = false; }
}

/* ================= Actions ================= */
function armed(el) {
  if (!el.dataset.confirm) return true;
  if (el.dataset.armed) return true;
  el.dataset.armed = '1'; const old = el.innerHTML;
  el.innerHTML = el.dataset.confirm === '1' ? ic('trash') : esc(el.dataset.confirm);
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = old; } }, 3500);
  return false;
}
const ACT = {
  go: el => { if (SES) exitStudy(); go(el.dataset.view); },
  today: () => startToday(),
  group: el => { const g = el.dataset.g === 'u' ? 'u' : +el.dataset.g; startGroup(g); },
  batch: el => startBatch(+el.dataset.b),
  goaledit: () => { if (SES) exitStudy(); UI.goal = {days:clampDays(S.settings.days), from:goalDefaultFrom()}; UI.view = 'plan'; saveUI(); render(); const g = $('#goaled'); if (g) g.scrollIntoView({block:'start'}); },
  goalpick: el => { UI.goal = {days:+el.dataset.days, from:UI.goal ? UI.goal.from : goalDefaultFrom()}; render(); const g = $('#goaled'); if (g) g.scrollIntoView({block:'nearest'}); },
  goalcancel: () => { UI.goal = null; render(); },
  goalapply: () => {
    const dr = UI.goal; if (!dr) return;
    const learnedAny = BASE_IDS.some(id => S.cards[id]), t = now();
    S.settings.days = clampDays(dr.days);
    if (dr.from !== 'keep') S.settings.start = studyDate(t);
    S.settings.plan = (dr.from !== 'keep' && learnedAny) ? encodeIds(BASE_IDS.filter(id => !S.cards[id])) : null;
    S.settings.upd = t; PLANC = null; UI.goal = null; UI.planSel = 0; UI.calPage = null;
    touch('meta'); toast(`Đã đặt mục tiêu ${goalLabel(S.settings.days)}: xong ngày ${dmy(dateOfDay(S.settings.days))}`); render(); window.scrollTo(0, 0);
  },
  calpage: el => { UI.calPage = +el.dataset.p; UI.planSel = 0; render(); },
  practice: el => startPractice(el.dataset.k, el),
  test: () => startTest(),
  flip: () => flip(),
  rate: el => answer(+el.dataset.r),
  undo: () => undo(),
  exit: () => exitStudy(),
  learnnow: () => { const id = SES.learn.slice().sort((a, b) => S.cards[a][1] - S.cards[b][1])[0]; advance(id); },
  speak: el => speak(el.dataset.t),
  pickday: el => { const d = +el.dataset.d; UI.planSel = d; UI.calPage = Math.floor((d - 1) / 7 / PAGE_W); if (UI.view !== 'plan') { UI.view = 'plan'; saveUI(); } render(); const det = $('#detail'); if (det && window.innerWidth < 900) det.scrollIntoView({behavior:'smooth', block:'start'}); },
  markbatch: el => {
    if (!armed(el)) return;
    const bt = plan().batches[+el.dataset.b], t = now(); let n = 0; if (!bt) return;
    for (const id of bt.ids) if (!S.cards[id]) { const i = 2 + Math.floor(Math.random() * 4); putCard(id, {s:2, d:dueAtDays(i, t), i, e:START_EASE, p:0, r:0, l:0, t:Math.round(t / MIN), f:studyDate(t)}); n++; }
    touch('srs'); toast(`Đã đánh dấu ${n} từ — sẽ ôn lại trong 2–5 ngày tới`); render();
  },
  word: el => openWord(el.dataset.id),
  closemodal: () => closeModal(),
  resetcard: el => { if (!armed(el)) return; delete S.cards[el.dataset.id]; delete S.cards[kId(el.dataset.id)]; touch('srs'); closeModal(); toast('Đã đặt lại thẻ về “Chưa học”'); if (SES) renderStudy(); else render(); },
  editword: el => { closeModal(); UI.editId = el.dataset.id; UI.view = 'add'; saveUI(); render(); window.scrollTo(0, 0); },
  delword: el => { if (!armed(el)) return; const w = WORDS.get(el.dataset.id); deleteWord(el.dataset.id); closeModal(); if (UI.editId === el.dataset.id) UI.editId = null; toast(`Đã xóa「${w ? w.w : ''}」`); render(); },
  canceledit: () => { UI.editId = null; render(); },
  clearform: () => { const f = $('#addForm'); if (f) { f.reset(); [...f.elements].forEach(x => { if (x.tagName === 'INPUT') x.value = ''; else if (x.tagName === 'SELECT') x.value = ''; }); updatePreview(); } },
  more: () => { UI.list.limit += 80; refreshList(); },
  bulkexample: () => { const t = $('#bulkText'); if (t) { t.value = '延期 | えんき | danh từ する | 〜を | DIÊN KỲ | hoãn lại, dời lại | 試合[しあい]が{延期[えんき]}になる | trận đấu bị hoãn | 会議[かいぎ]を{延期[えんき]}する | dời cuộc họp\n打ち合わせ | うちあわせ | danh từ する | 〜と | ĐẢ HỢP | cuộc họp bàn trước | 取引先[とりひきさき]と{打[う]ち合[あ]わせ}をする | họp bàn với đối tác\nわざわざ | わざわざ | phó từ | | | cất công, mất công | {わざわざ}来[き]てくれる | cất công đến'; UI.bulk = {text:t.value, rows:null}; $('#bulkRes').innerHTML = ''; } },
  bulkcheck: () => { const t = $('#bulkText'); const rows = parseBulk(t ? t.value : ''); UI.bulk = {text:t ? t.value : '', rows}; $('#bulkRes').innerHTML = rows.length ? bulkTable(rows) : '<p class="small muted">Chưa có dòng nào.</p>'; },
  bulkadd: () => {
    const rows = (UI.bulk && UI.bulk.rows || []).filter(r => !r.err && !r.dup); if (!rows.length) return;
    let t = now(); for (const r of rows) { const id = 'u' + (t++).toString(36) + Math.random().toString(36).slice(2, 6); CW[id] = Object.assign({id}, r.d, {at:t, upd:t}); Sync.putWord(id); }
    applyCustom(); saveLocalSoon(); UI.bulk = null; toast(`Đã thêm ${rows.length} từ vào Từ của tôi`); render();
  },
  export: () => doExport(),
  
  dlblob: el => { const t = $('#expText'); if (!t) return; try { const url = URL.createObjectURL(new Blob([t.value], {type:'application/json'})); const a = document.createElement('a'); a.href = url; a.download = el.dataset.f; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); } catch (e) { toast('Không tải được — hãy dùng Sao chép'); } },
  
  copyexp: () => { const t = $('#expText'); if (!t) return; copyText(t.value, t).then(ok => toast(ok ? 'Đã sao chép' : 'Hãy chọn và sao chép thủ công')); },
  copyprog: () => { saveLocal(); packCode(exportData()).then(code => copyText(code)).then(ok => toast(ok ? 'Đã chép mã tiến độ — dán vào ứng dụng kia: Cài đặt → Dán mã tiến độ' : 'Không chép được — hãy dùng Xuất bản sao lưu')); },
  acct: () => acctAction(),
  authtab: el => { UI.auth.kind = el.dataset.k; UI.auth.msg = ''; refreshAuth(); const f = $('#authBox input:not([type=hidden]):not([type=checkbox])'); if (f) f.focus(); },
  authretry: () => { ACC.infoErr = ''; loadAuthInfo(GAS ? '' : ($('#authUrl') ? $('#authUrl').value : '')); },
  logout: el => doLogout(el),
  pwopen: () => { const b = $('#pwBox'); if (!b) return; b.hidden = !b.hidden; if (!b.hidden) { const i = $('#pwOld'); if (i) i.focus(); } },
  admreload: () => { loadAdmin(true); render(); },
  admgen: () => { const i = $('#admPw'); if (i) i.value = randPw(); },
  admcopy: () => { if (ADM.made) copyText(credText(ADM.made)).then(ok => toast(ok ? 'Đã chép thông tin đăng nhập' : 'Hãy chọn và chép thủ công')); },
  admcopyurl: () => { if (ADM.url) copyText(ADM.url).then(ok => toast(ok ? 'Đã chép link ứng dụng' : 'Hãy chọn và chép thủ công')); },
  admdone: () => { ADM.made = null; render(); },
  admreset: async el => {
    if (!armed(el)) return;
    const n = el.dataset.n, pw = randPw(); el.disabled = true;
    const r = await admRun({a:'adminReset', name:n, dk:await pwKey(n, pw)});
    el.disabled = false;
    if (r) { const u = (ADM.users || []).find(x => x.name === n); ADM.made = {name:n, pw, display:u ? u.display : n, reset:true}; render(); toast('Đã đặt lại mật khẩu cho ' + n); const mb = $('.madebox'); if (mb) mb.scrollIntoView({block:'center'}); }
  },
  admlock: async el => { if (el.dataset.on === '0' && !armed(el)) return; el.disabled = true; const r = await admRun({a:'adminStatus', name:el.dataset.n, on:el.dataset.on === '1'}, el.dataset.on === '1' ? 'Đã mở khóa tài khoản' : 'Đã khóa tài khoản'); if (r) loadAdmin(true); else el.disabled = false; },
  admdel: async el => { if (!armed(el)) return; el.disabled = true; const n = el.dataset.n; const r = await admRun({a:'adminDelete', name:n}, 'Đã xóa tài khoản ' + n); if (r) { ADM.users = (ADM.users || []).filter(u => u.name !== n); render(); } else el.disabled = false; },
  admcode: async el => { if (!armed(el)) return; const r = await admRun({a:'adminCfg', newCode:true}, 'Đã đổi mã lớp'); if (r) { ADM.cfg = r.cfg; render(); } },
  pastebox: () => { const b = $('#pasteBox'); if (!b) return; b.hidden = !b.hidden; if (!b.hidden) { const t = $('#pasteText'); if (t) t.focus(); } },
  pasteimp: () => { const t = $('#pasteText'), v = t ? t.value.trim() : ''; if (!v) { toast('Hãy dán mã tiến độ trước'); return; } unpackCode(v).then(handleImport).catch(() => { const box = $('#impBox'); if (box) box.innerHTML = '<p class="note" style="margin-top:12px;color:var(--again)">Mã không đọc được — hãy chép lại toàn bộ mã (bắt đầu bằng MMK3:).</p>'; }); },
  quiz: () => { if (SES) exitStudy(); startQuiz(); },
  qpick: el => qpick(+el.dataset.i),
  qnext: () => qnext(),
  kcheck: () => kcheck(),
  shufflenow: () => {
    if (!SES || SES.mode === 'quiz') return;
    const cur = SES.cur, keep = !!cur && SES.main[0] === cur, rest = keep ? SES.main.slice(1) : SES.main.slice();
    if (rest.length < 2) { toast('Không còn đủ thẻ để xáo trộn'); return; }
    shuffle(rest); SES.main = keep ? [cur, ...rest] : rest; toast(`Đã xáo trộn ${rest.length} thẻ còn lại`);
  },
  listen: () => {
    S.settings.listen = !S.settings.listen; S.settings.upd = now(); touch('meta');
    if (SES && SES.mode !== 'quiz') { renderStudy(); if (S.settings.listen && SES.cur && !isKCard(SES.cur) && !SES.flipped) { const w = WORDS.get(wordOf(SES.cur)); if (w) speak(w.k); } }
    toast(S.settings.listen ? 'Bật chế độ nghe: mặt trước chỉ phát âm' : 'Đã tắt chế độ nghe');
  },
  note: el => openNote(el.dataset.id, el.closest('#modal') ? 'word' : SES ? 'study' : ''),
  notesave: el => { const t = $('#noteText'); setNote(el.dataset.id, t ? t.value : '', el.dataset.from); toast('Đã lưu mẹo nhớ'); },
  notedel: el => { if (!armed(el)) return; setNote(el.dataset.id, '', el.dataset.from); toast('Đã xóa mẹo nhớ'); },
  import: () => $('#impFile').click(),
  impmerge: () => applyImport(false),
  impreplace: el => { if (armed(el)) applyImport(true); },
  impcancel: () => { IMPORTED = null; const b = $('#impBox'); if (b) b.innerHTML = ''; },
  resetall: el => { if (!armed(el)) return; S.cards = {}; S.resetAt = now(); S.log = {}; S.tests = []; touch('srs', 'meta'); toast('Đã đặt lại toàn bộ tiến độ'); render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.disabled) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'addForm') { e.preventDefault(); submitForm(); }
  else if (f.classList && f.classList.contains('kform')) { e.preventDefault(); kcheck(); }
  else if (f.id === 'authForm') { e.preventDefault(); doAuth(f); }
  else if (f.id === 'pwForm') { e.preventDefault(); doPasswd(f); }
  else if (f.id === 'admForm') { e.preventDefault(); doAdmCreate(f); }
});
let pvT = 0;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest && t.closest('#addForm')) { clearTimeout(pvT); pvT = setTimeout(updatePreview, 120); }
  if (t.id === 'lq') { clearTimeout(listT); listT = setTimeout(() => { UI.list.q = t.value; UI.list.limit = 80; saveUI(); refreshList(); }, 160); }
  if (t.id === 'bulkText') { UI.bulk = {text:t.value, rows:UI.bulk && UI.bulk.rows}; }
  if (t.id === 'authUrl') { clearTimeout(ACC.urlT); ACC.urlT = setTimeout(() => { const u = normUrl(t.value); if (u && u !== ACC.infoUrl) { ACC.info = null; ACC.infoErr = ''; loadAuthInfo(u); } }, 700); }
  if (t.id === 'kAns') { const pv = $('#kPrev'); if (pv) { const v = t.value.trim(); pv.textContent = /[a-zA-Z]/.test(v) ? toKana(v) : ''; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'lg' || t.id === 'ls') { UI.list[t.id === 'lg' ? 'g' : 'st'] = t.value; UI.list.limit = 80; saveUI(); refreshList(); }
  else if (t.id === 'f_pos') updatePreview();
  else if (t.id === 'setStart') { if (isYmd(t.value)) { S.settings.start = t.value; S.settings.upd = now(); UI.planSel = 0; UI.calPage = null; touch('meta'); toast('Đã đổi ngày bắt đầu: ' + dmy(t.value)); } }
  else if (t.id === 'setPer') { const v = Math.max(0, Math.min(200, parseInt(t.value, 10) || 0)); t.value = v; S.settings.perDay = v; S.settings.upd = now(); touch('meta'); toast('Đã lưu: ' + v + ' từ của tôi mỗi ngày'); }
  else if (t.id === 'goalDays') { const v = parseInt(t.value, 10); if (v) { UI.goal = {days:clampDays(v), from:UI.goal ? UI.goal.from : goalDefaultFrom()}; render(); const g = $('#goaled'); if (g) g.scrollIntoView({block:'nearest'}); } }
  else if (t.name === 'gfrom') { if (UI.goal) { UI.goal.from = t.value; render(); const g = $('#goaled'); if (g) g.scrollIntoView({block:'nearest'}); } }
  else if (t.id === 'setSpeak') { S.settings.autoSpeak = t.checked; S.settings.upd = now(); touch('meta'); }
  else if (t.id === 'setKOn' || t.id === 'setTypeK' || t.id === 'setShuffle' || t.id === 'setListen') { const k = {setKOn:'kOn', setTypeK:'typeK', setShuffle:'shuffle', setListen:'listen'}[t.id]; S.settings[k] = t.checked; S.settings.upd = now(); touch('meta'); toast('Đã lưu cài đặt'); }
  else if (t.id === 'setKPer') { const v = Math.max(0, Math.min(100, parseInt(t.value, 10) || 0)); t.value = v; S.settings.kPerDay = v; S.settings.upd = now(); touch('meta'); toast('Đã lưu: tối đa ' + v + ' thẻ chữ Hán mới mỗi ngày'); }
  else if (t.id === 'admSelf') { admRun({a:'adminCfg', selfReg:t.checked}, t.checked ? 'Đã bật tự đăng ký' : 'Đã tắt tự đăng ký').then(r => { if (r) ADM.cfg = r.cfg; else t.checked = !t.checked; }); }
  else if (t.id === 'impFile') { const f = t.files && t.files[0]; if (f) f.text().then(handleImport); t.value = ''; }
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && tg.id === 'kAns') { if (e.key === ' ' && !tg.value.trim()) { e.preventDefault(); tg.blur(); flip(); } else if (e.key === 'Escape') { e.preventDefault(); tg.blur(); if (SES) exitStudy(); } return; }
  if (tg.closest && tg.closest('input,textarea,select')) return;
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (!SES) return;
  if (SES.mode === 'quiz') {
    if (e.key === 'Escape') { exitStudy(); return; }
    if (/^[1-4]$/.test(e.key) && SES.picked == null && SES.qi < SES.qs.length) { e.preventDefault(); qpick(+e.key - 1); return; }
    if ((e.key === 'Enter' || e.key === ' ') && SES.picked != null) { e.preventDefault(); qnext(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') { if (e.target.closest('button') && e.target.id !== 'card' && e.key === 'Enter') return; e.preventDefault(); if (SES.cur) flip(); return; }
  if (e.key === 'Escape') { exitStudy(); return; }
  if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); return; }
  if (/^[1-4]$/.test(e.key) && SES.cur && SES.revealed) { e.preventDefault(); let r = +e.key; if (SES.mode !== 'srs') r = r === 1 ? 1 : 3; answer(r); }
});
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, true);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocal(); Sync.flushAll(); } else if (Sync.mode === 'server') SSync.refresh(); });
window.addEventListener('pagehide', () => { saveLocal(); Sync.flushAll(); });

/* ================= Boot ================= */
loadUIPrefs();
ACC.sess = loadSess();
if (ACC.sess) { ACCOUNT = {kind:'server', name:ACC.sess.user.display, email:ACC.sess.user.name}; Sync.mode = 'server'; loadState(userKey(ACC.sess)); }
else loadState(GAS ? '' : LS_KEY);
pickVoice();
if (window.speechSynthesis && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', () => { const had = !!JA_VOICE; pickVoice(); if (!had && JA_VOICE && !SES) render(); });
render();
Sync.init().catch(() => Sync.set('local'));
let lastDay = studyDate();
setInterval(() => { const d = studyDate(); if (d !== lastDay) { lastDay = d; if (!SES) render(); } }, 60000);
})();
